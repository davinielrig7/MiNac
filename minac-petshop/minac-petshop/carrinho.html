
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrinho | Minac</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="topbar">

        <div class="container-fluid d-flex align-items-center justify-content-between px-4 px-lg-5">

            <div class="brand-area">

                <a class="icon-btn" href="index.html" aria-label="Perfil">
                    <span class="person"></span>
                </a>

                <h1 class="page-title">CARRINHO</h1>

            </div>

            <div class="header-actions">

                <div class="search-box">
                    PROCURAR　⌕
                </div>

                <a class="icon-btn" href="carrinho.html" aria-label="Carrinho">
                    🛒
                </a>

            </div>

        </div>

    </header>

    <!-- DECORAÇÃO DE PATINHAS -->
    <div class="paw-strip">
        🐾 · 🐾 · 🐾 · 🐾 · 🐾 · 🐾 · 🐾
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container-fluid page-wrap">

        <div class="content">

            <!-- LISTA DE PRODUTOS -->
            <div class="cart-list">

                <!-- PRODUTO 1 -->
                <article class="cart-item">

                    <input type="checkbox" checked>

                    <img
                        src="img/racao-pedigree.jpg"
                        alt="Ração Pedigree para cães"
                    >

                    <div class="cart-item-name">
                        RAÇÃO PEDIGREE PARA CÃES
                    </div>

                    <div class="cart-meta">
                        VALOR UNITÁRIO: R$ 69,90
                    </div>

                    <div class="cart-meta">
                        VALOR TOTAL: R$ 139,80
                    </div>

                    <label class="cart-meta">
                        QUANTIDADE:
                        <input
                            class="qty"
                            type="number"
                            min="1"
                            value="2"
                        >
                    </label>

                </article>

                <div class="dotted-line"></div>

                <!-- PRODUTO 2 -->
                <article class="cart-item">

                    <input type="checkbox" checked>

                    <img
                        src="img/shampoo.jpg"
                        alt="Shampoo para cachorro"
                    >

                    <div class="cart-item-name">
                        SHAMPOO PARA CACHORRO
                    </div>

                    <div class="cart-meta">
                        VALOR UNITÁRIO: R$ 89,90
                    </div>

                    <div class="cart-meta">
                        VALOR TOTAL: R$ 89,90
                    </div>

                    <label class="cart-meta">
                        QUANTIDADE:
                        <input
                            class="qty"
                            type="number"
                            min="1"
                            value="1"
                        >
                    </label>

                </article>

                <div class="dotted-line"></div>

            </div>

            <!-- TOTAL E FINALIZAÇÃO -->
            <div class="cart-bottom d-flex justify-content-end align-items-center gap-4">

                <strong>
                    TOTAL: R$ 229,70
                </strong>

                <a class="btn-brown" href="pagamento.html">
                    CONCLUIR
                </a>

                <a
                    class="trash-btn"
                    href="carrinho.html"
                    aria-label="Excluir"
                >
                    ▤
                </a>

            </div>

        </div>

    </main>

</body>
</html>
