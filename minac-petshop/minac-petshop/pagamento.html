
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pagamento | Minac</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="topbar">

        <div class="container-fluid d-flex align-items-center justify-content-between px-4 px-lg-5">

            <div class="brand-area">

                <a class="icon-btn" href="index.html" aria-label="Perfil">
                    <span class="person"></span>
                </a>

                <h1 class="page-title"></h1>

            </div>

            <div class="header-actions">

                <div class="search-box">
                    PROCURAR　⌕
                </div>

                <a class="icon-btn" href="carrinho.html" aria-label="Carrinho">
                    🛒
                </a>

            </div>

        </div>

    </header>

    <!-- DECORAÇÃO DE PATINHAS -->
    <div class="paw-strip">
        🐾 · 🐾 · 🐾 · 🐾 · 🐾 · 🐾 · 🐾
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container-fluid page-wrap">

        <div class="content">

            <div class="row payment-layout">

                <!-- PRODUTOS DA COMPRA -->
                <div class="col-lg-5 payment-products">

                    <h2>Produtos</h2>

                    <!-- PRODUTO 1 -->
                    <div class="payment-product">

                        <img
                            src="img/racao-pedigree.jpg"
                            alt="Ração Pedigree para cães"
                        >

                        <div>

                            <strong>
                                RAÇÃO PEDIGREE PARA CÃES
                            </strong>

                            <b>R$ 69,90</b>

                            <small>QUANTIDADE: 2</small>

                            <small>R$ 139,80</small>

                        </div>

                    </div>

                    <!-- PRODUTO 2 -->
                    <div class="payment-product">

                        <img
                            src="img/shampoo.jpg"
                            alt="Shampoo para cachorro"
                        >

                        <div>

                            <strong>
                                SHAMPOO PARA CACHORRO
                            </strong>

                            <b>R$ 89,90</b>

                            <small>QUANTIDADE: 1</small>

                            <small>R$ 89,90</small>

                        </div>

                    </div>

                    <!-- BOTÃO DE FINALIZAÇÃO -->
                    <a class="btn-brown finish-btn" href="index.html">
                        FINALIZAR COMPRA
                    </a>

                </div>

                <!-- FORMAS DE PAGAMENTO -->
                <div class="col-lg-7 payment-methods">

                    <h2>Forma de pagamento</h2>

                    <div class="method-list">

                        <label class="payment-method">

                            <input
                                type="radio"
                                name="pagamento"
                            >

                            PIX

                        </label>

                        <label class="payment-method">

                            <input
                                type="radio"
                                name="pagamento"
                            >

                            CARTÃO

                        </label>

                    </div>

                    <!-- VALOR TOTAL -->
                    <p class="text-center fw-bold">
                        TOTAL: R$ 229,70
                    </p>

                </div>

            </div>

        </div>

    </main>

</body>
</html>
